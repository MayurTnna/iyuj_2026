<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <!-- Deep Royal Background Gradient -->
        <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020408"/>
            <stop offset="50%" stop-color="#0B132B"/>
            <stop offset="100%" stop-color="#050B14"/>
        </linearGradient>

        <!-- Royal Gold Metallic Gradient -->
        <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#996515"/>
            <stop offset="25%" stop-color="#FFD700"/>
            <stop offset="50%" stop-color="#F3E5AB"/>
            <stop offset="75%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#AA771C"/>
        </linearGradient>

        <!-- Gold Glow Filter -->
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Circular Midnight Background -->
    <circle cx="50" cy="50" r="46" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5"/>

    <!-- Inner Filigree Ring -->
    <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Royal Crown Top -->
    <g filter="url(#goldGlow)">
        <!-- Crown Body -->
        <path d="M 28 42 L 35 24 L 43 33 L 50 18 L 57 33 L 65 24 L 72 42 Z" fill="url(#favGold)"/>
        <!-- Crown Jewels -->
        <circle cx="35" cy="21" r="2.5" fill="#FFF8DC"/>
        <circle cx="50" cy="15" r="3.5" fill="#FFF8DC"/>
        <circle cx="65" cy="21" r="2.5" fill="#FFF8DC"/>
        <!-- Crown Base Band -->
        <rect x="27" y="42" width="46" height="4" rx="2" fill="url(#favGold)"/>
    </g>

    <!-- Royal Monogram "J" (Queen Jiyu) -->
    <text x="50" y="78" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#favGold)" text-anchor="middle" filter="url(#goldGlow)">J</text>

    <!-- Stardust Sparkle Accents -->
    <circle cx="22" cy="30" r="1.5" fill="#FFD700" opacity="0.8"/>
    <circle cx="78" cy="30" r="1.5" fill="#FFD700" opacity="0.8"/>
    <circle cx="18" cy="65" r="1" fill="#FFF8DC" opacity="0.6"/>
    <circle cx="82" cy="65" r="1" fill="#FFF8DC" opacity="0.6"/>
</svg>
